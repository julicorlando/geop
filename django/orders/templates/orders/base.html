<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}GEOP{% endblock %}</title><style>
:root{font-family:system-ui,sans-serif;color:#172033;background:#f3f5f9}body{margin:0}header{background:#123b67;color:white;padding:1rem 5vw;display:flex;justify-content:space-between;align-items:center}header a{color:white;margin-left:1rem}main{max-width:1100px;margin:2rem auto;padding:0 1rem}.card{background:white;border-radius:12px;padding:1.2rem;margin:1rem 0;box-shadow:0 3px 14px #10204012}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem}.button,button{background:#1469bd;color:white;border:0;padding:.65rem 1rem;border-radius:7px;cursor:pointer;text-decoration:none}input,textarea,select{box-sizing:border-box;width:100%;padding:.65rem;border:1px solid #ccd3df;border-radius:6px;margin:.25rem 0 1rem}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:.65rem;border-bottom:1px solid #e6e9ef}.muted{color:#667085}.danger{background:#a83232}.messages{background:#fff8dc;padding:.8rem;border-radius:8px}
</style></head><body><header><strong>GEOP · Gestão de Ordens</strong><nav><a href="{% url 'dashboard' %}">Painel</a><a href="{% url 'order_list' %}">Ordens</a><a href="{% url 'order_create' %}">Nova OS</a>{% if user.is_authenticated %}<form style="display:inline" method="post" action="{% url 'logout' %}">{% csrf_token %}<button> Sair </button></form>{% endif %}</nav></header><main>{% if messages %}<div class="messages">{% for message in messages %}{{ message }}{% endfor %}</div>{% endif %}{% block content %}{% endblock %}</main></body></html>
