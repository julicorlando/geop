<table><thead><tr><th>Ordem</th><th>Resumo</th><th>Status</th><th>Prioridade</th><th>Local</th><th>Responsável</th></tr></thead><tbody>{% for o in orders %}<tr><td><a href="{% url 'order_detail' o.pk %}">{{ o.number }}</a></td><td>{{ o.title }}</td><td>{{ o.get_status_display }}</td><td>{{ o.get_priority_display }}</td><td>{{ o.location }}</td><td>{{ o.agent|default:"—" }}</td></tr>{% empty %}<tr><td colspan="6">Nenhuma ordem encontrada.</td></tr>{% endfor %}</tbody></table>
