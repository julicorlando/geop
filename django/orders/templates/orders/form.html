{% extends "orders/base.html" %}{% block content %}<div class="card"><h1>Nova ordem de serviço</h1>{% if error %}<p>{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label>Título</label><input name="title" required maxlength="220"><label>Descrição</label><textarea name="description" required rows="5"></textarea><label>Local</label><select name="location" required>{% for x in locations %}<option value="{{ x.pk }}">{{ x.name }}</option>{% endfor %}</select><label>Categoria</label><select name="category" required>{% for x in categories %}<option value="{{ x.pk }}">{{ x.name }}</option>{% endfor %}</select><label>Prioridade</label><select name="priority">{% for x,label in priorities %}<option value="{{ x }}">{{ label }}</option>{% endfor %}</select><button>Criar OS</button></form></div>{% endblock %}
