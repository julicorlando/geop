{% extends "base.html" %}{% load static %}
{% block titulo %}Entrar{% endblock %}
{% block corpo %}
<div class="login-wrap">
  <form method="post" class="card login-card" novalidate>
    {% csrf_token %}
    <div class="marca-publica" style="display:flex;gap:.6rem;align-items:center;margin-bottom:1rem">
      <img src="{% static 'icon.svg' %}" width="36" height="36" alt="">
      <div><strong style="font-size:1.2rem">GEOP</strong><div class="muted" style="font-size:.85rem">Gestão de Ordens e Operações · {{ GEOP_NOME_UNIDADE }}</div></div>
    </div>
    {% include "core/_mensagens.html" %}
    {% include "core/_campos.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" style="width:100%">Entrar</button>
    <p class="ajuda" style="text-align:center;margin-top:1rem"><a href="{% url 'accounts:recuperar' %}">Esqueceu a senha?</a></p>
  </form>
</div>
{% endblock %}
