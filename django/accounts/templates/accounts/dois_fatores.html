{% extends "base.html" %}{% load static %}
{% block titulo %}Verificação{% endblock %}
{% block corpo %}<div class="login-wrap"><form method="post" class="card login-card">{% csrf_token %}
  <h1>Verificação em duas etapas</h1><p class="muted">Digite o código de 6 dígitos do seu aplicativo autenticador.</p>
  {% if erro %}<div class="msg msg-error" style="margin-bottom:1rem">{{ erro }}</div>{% endif %}
  <div class="campo"><input type="text" name="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" autofocus required style="font-size:1.6rem;letter-spacing:.3em;text-align:center"></div>
  <button style="width:100%">Confirmar</button><p class="ajuda" style="text-align:center"><a href="{% url 'accounts:login' %}">Voltar</a></p></form></div>{% endblock %}
