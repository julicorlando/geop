{% extends "base.html" %}
{% block titulo %}Configurações{% endblock %}
{% block conteudo %}
<div class="cabecalho"><h1>Configurações do GEOP</h1><div class="acoes"><a class="btn btn-sec" href="{% url 'core:saude' %}">Saúde</a><a class="btn btn-sec" href="{% url 'core:backups' %}">Backups</a><a class="btn btn-sec" href="{% url 'ia:configuracao' %}">GEOP IA</a></div></div>
<form method="post" class="card" style="max-width:640px">{% csrf_token %}
{% for i in itens %}<div class="campo">{% if i.tipo == "bool" %}<label class="checkbox"><input type="checkbox" name="{{ i.chave }}" value="1" {% if i.valor == "1" %}checked{% endif %}> {{ i.rotulo }}</label>{% else %}<label>{{ i.rotulo }}</label><input type="number" min="0" name="{{ i.chave }}" value="{{ i.valor }}">{% endif %}</div>{% endfor %}
<button>Salvar</button></form>
{% endblock %}
