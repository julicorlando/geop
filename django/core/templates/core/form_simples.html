{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<div class="cabecalho"><h1>{% if form.instance.pk %}Editar{% else %}Novo{% endif %}: {{ titulo }}</h1></div>
<form method="post" class="card" enctype="multipart/form-data" novalidate>
  {% csrf_token %}
  {% include "core/_campos.html" %}
  <div class="chips">
    <button type="submit">Salvar</button>
    {% if voltar %}<a class="btn btn-sec" href="{% url voltar %}">Cancelar</a>{% elif voltar_url %}<a class="btn btn-sec" href="{{ voltar_url }}">Cancelar</a>{% endif %}
  </div>
</form>
{% endblock %}
